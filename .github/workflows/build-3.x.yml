name: CI

on:
  push:
    branches: [ 3.x ]
  pull_request:
    branches: [ 3.x ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php-versions: ["8.3", "8.4"]
        drupal-version: ["10.5", "10.6", "11.2", "11.3"]
    name: PHP ${{ matrix.php-versions }} | drupal ${{ matrix.drupal-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: PHPUNIT tests
        run: |
          docker run \
            --rm \
            --name drupal \
            --hostname drupal \
            --volume $(pwd):/var/www/drupal/web/modules/contrib/$ENABLE_MODULES:ro \
            --env ENABLE_MODULES \
           ghcr.io/islandora/ci:${{ matrix.drupal-version }}-php${{ matrix.php-versions }}
        env:
          ENABLE_MODULES: openseadragon
